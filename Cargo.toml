[package]
name = "zhs-brush"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "ZHS-Brush-RUST：智慧树/知到 课程管理与学习工具（Rust 实现）"
license = "Apache-2.0"
repository = "https://github.com/example/zhs-brush-rust"
default-run = "zhs-brush"
build = "build.rs"

# 两个入口：
# - zhs-brush     : 控制台子系统，CLI 用（login / fetch / run），也能 `gui` 但会带黑框
# - zhs-brush-gui : Windows 子系统，双击无黑框，只跑图形界面
[[bin]]
name = "zhs-brush"
path = "src/main.rs"

[[bin]]
name = "zhs-brush-gui"
path = "src/bin/gui.rs"


[build-dependencies]
winres = "0.1"

[dependencies]
anyhow = "1"
num-bigint = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "gzip",
    "deflate",
    "brotli",
    "default-tls",
] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
rand = "0.8"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true
